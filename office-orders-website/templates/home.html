<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GCP Portal</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            margin-bottom: 40px;
        }

        .card {
            display: inline-block;
            padding: 30px;
            margin: 20px;
            width: 200px;
            border-radius: 10px;
            background: #2c3e50;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            background: #34495e;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<h1>📚 GCP Portal</h1>

<div class="card" onclick="location.href='/office-orders'">
    <h2>Office Orders</h2>
</div>

<div class="card" onclick="location.href='/timetable'">
    <h2>Timetable</h2>
</div>

</body>
</html>
